[package]
name = "reloader"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "env"] }
axum = "0.8.7"
cloudevents-sdk = { version = "0.9.0", features = ["axum"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-resource-detectors = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.117"
google-cloud-run-v2 = "1.2.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0.100"
futures = "0.3.31"
tower-http = { version = "0.6.6", features = ["trace"] }
google-cloud-wkt = "1.2.1"
google-cloud-lro = "1.3.1"
